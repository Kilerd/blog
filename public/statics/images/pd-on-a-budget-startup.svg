<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Hiragino Sans GB&#x27;, &#x27;Noto Sans CJK SC&#x27;, &#x27;Microsoft YaHei&#x27;, &#x27;Segoe UI&#x27;, sans-serif">
<title id="t">PD 单元启动时间从 148 秒降到 47 秒</title>
<desc id="d">上半部分：原始版本 148 秒，按角色捕获 graph 并行预编译 JIT 后 79 秒，再加 piecewise 封顶和 HiCache 后台锁页后 47 秒。下半部分：测出来的浪费，Decode 侧 JIT 串行编译约 49 秒、无用 piecewise graph 29 秒、同步锁页 20.5 秒；Prefill 侧无用 decode graph 23 秒、采样器 graph 23 秒、piecewise 封顶省 20 秒、同步锁页 8 秒。</desc>
<rect width="960" height="640" fill="#fcfcfb"/>
<text x="24.0" y="34.0" font-size="18" fill="#0b0b0b" text-anchor="start" font-weight="600">PD 单元启动：148 s → 47 s</text>
<text x="24.0" y="58.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400">5090 上一个 1P1D 单元，从 Pod 启动到 LB /health 返回 200。</text>
<line x1="380.0" y1="90.0" x2="380.0" y2="252.0" stroke="#c3c2b7" stroke-width="1"/>
<text x="380.0" y="270.0" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">0 s</text>
<line x1="500.0" y1="90.0" x2="500.0" y2="252.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="500.0" y="270.0" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">40 s</text>
<line x1="620.0" y1="90.0" x2="620.0" y2="252.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="620.0" y="270.0" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">80 s</text>
<line x1="740.0" y1="90.0" x2="740.0" y2="252.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="740.0" y="270.0" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">120 s</text>
<line x1="860.0" y1="90.0" x2="860.0" y2="252.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="860.0" y="270.0" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">160 s</text>
<text x="24.0" y="119.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">改之前</text>
<text x="24.0" y="137.0" font-size="12" fill="#898781" text-anchor="start" font-weight="400">D 140 s、P 119 s 就绪</text>
<path d="M380.0,112.0 H820.0 Q824.0,112.0 824.0,116.0 V128.0 Q824.0,132.0 820.0,132.0 H380.0 Z" fill="#2a78d6"/>
<text x="832.0" y="127.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">148 s</text>
<text x="24.0" y="171.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">+ 按角色捕获 graph、并行预编译 JIT</text>
<text x="24.0" y="189.0" font-size="12" fill="#898781" text-anchor="start" font-weight="400">D 65 s、P 76 s 就绪</text>
<path d="M380.0,164.0 H613.0 Q617.0,164.0 617.0,168.0 V180.0 Q617.0,184.0 613.0,184.0 H380.0 Z" fill="#2a78d6"/>
<text x="625.0" y="179.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">79 s</text>
<text x="24.0" y="223.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">+ P 的 piecewise 封顶、HiCache 后台锁页</text>
<text x="24.0" y="241.0" font-size="12" fill="#898781" text-anchor="start" font-weight="400">D 39 s、P 45 s 就绪</text>
<path d="M380.0,216.0 H517.0 Q521.0,216.0 521.0,220.0 V232.0 Q521.0,236.0 517.0,236.0 H380.0 Z" fill="#2a78d6"/>
<text x="529.0" y="231.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">47 s</text>
<text x="24.0" y="318.0" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="600">测出来的浪费（秒）</text>
<text x="171.0" y="318.0" font-size="12" fill="#898781" text-anchor="start" font-weight="400">P 和 D 并行启动，这些数不能直接相加</text>
<line x1="380.0" y1="346.0" x2="380.0" y2="592.0" stroke="#c3c2b7" stroke-width="1"/>
<text x="380.0" y="610.0" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">0 s</text>
<line x1="540.0" y1="346.0" x2="540.0" y2="592.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="540.0" y="610.0" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">20 s</text>
<line x1="700.0" y1="346.0" x2="700.0" y2="592.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="700.0" y="610.0" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">40 s</text>
<line x1="860.0" y1="346.0" x2="860.0" y2="592.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="860.0" y="610.0" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">60 s</text>
<text x="24.0" y="356.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="600">Decode</text>
<text x="36.0" y="379.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="400">JIT 模块第一次用时串行 nvcc 编译</text>
<path d="M380.0,366.0 H768.0 Q772.0,366.0 772.0,370.0 V378.0 Q772.0,382.0 768.0,382.0 H380.0 Z" fill="#2a78d6"/>
<text x="780.0" y="379.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">≈49 s</text>
<text x="36.0" y="407.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="400">piecewise extend graph（D 从来不跑 extend）</text>
<path d="M380.0,394.0 H608.0 Q612.0,394.0 612.0,398.0 V406.0 Q612.0,410.0 608.0,410.0 H380.0 Z" fill="#2a78d6"/>
<text x="620.0" y="407.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">29 s</text>
<text x="36.0" y="435.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="400">HiCache 64 GiB 主机池同步锁页</text>
<path d="M380.0,422.0 H540.0 Q544.0,422.0 544.0,426.0 V434.0 Q544.0,438.0 540.0,438.0 H380.0 Z" fill="#2a78d6"/>
<text x="552.0" y="435.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">20.5 s</text>
<text x="24.0" y="470.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="600">Prefill</text>
<text x="36.0" y="493.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="400">decode graph bs 1–128（P 从来不 decode）</text>
<path d="M380.0,480.0 H560.0 Q564.0,480.0 564.0,484.0 V492.0 Q564.0,496.0 560.0,496.0 H380.0 Z" fill="#2a78d6"/>
<text x="572.0" y="493.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">23 s</text>
<text x="36.0" y="521.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="400">采样器 graph 梯子捕获到 128</text>
<path d="M380.0,508.0 H560.0 Q564.0,508.0 564.0,512.0 V520.0 Q564.0,524.0 560.0,524.0 H380.0 Z" fill="#2a78d6"/>
<text x="572.0" y="521.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">23 s</text>
<text x="36.0" y="549.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="400">piecewise 梯子封顶 2048 后省下</text>
<path d="M380.0,536.0 H537.6 Q541.6,536.0 541.6,540.0 V548.0 Q541.6,552.0 537.6,552.0 H380.0 Z" fill="#2a78d6"/>
<text x="549.6" y="549.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">20.2 s</text>
<text x="36.0" y="577.0" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="400">HiCache 24 GiB 主机池同步锁页</text>
<path d="M380.0,564.0 H440.0 Q444.0,564.0 444.0,568.0 V576.0 Q444.0,580.0 440.0,580.0 H380.0 Z" fill="#2a78d6"/>
<text x="452.0" y="577.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">8 s</text>
</svg>
