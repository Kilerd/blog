<title id="t">卡顿流占比：单体与 PD 1P1D</title>
<desc id="d">在 8、16、24、32、40 路时，单体（1 卡）卡顿流占比为 0.12%、0.32%、5.33%、19.28%、54.02%；PD 1P1D（2 卡）全部为 0。</desc>
