<title id="t">首段音频时间 p95 随并发的变化：单体与 PD 1P1D</title>
<desc id="d">单体（1 卡）从 2 路到 40 路，TTFA p95 从 289 ms 涨到 507 ms；PD 1P1D（2 卡）从 2 路到 64 路，从 300 ms 涨到 487 ms。8 路以上，同样并发下 PD 都更低，40 路时 406 vs 507 ms。纵轴从 200 ms 起。</desc>
