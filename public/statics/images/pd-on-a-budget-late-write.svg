<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Hiragino Sans GB&#x27;, &#x27;Noto Sans CJK SC&#x27;, &#x27;Microsoft YaHei&#x27;, &#x27;Segoe UI&#x27;, sans-serif">
<title id="t">迟到的写入如何污染别人的 KV</title>
<desc id="d">t0：Prefill 开始往 Decode 的页里写请求 A 的 KV，随后卡住了几秒。t1：Decode 等不到结果，判定传输失败，释放 A 的页。t2：请求 B 拿到这些页并开始解码。t3：Prefill 那笔迟到的写入落进了 B 的页，B 的 KV 被悄悄改掉，没有任何报错。</desc>
<rect width="960" height="400" fill="#fcfcfb"/>
<text x="24.0" y="34.0" font-size="18" fill="#0b0b0b" text-anchor="start" font-weight="600">迟到的写入：一次没有报错的 KV 污染</text>
<text x="24.0" y="58.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400">如果 D 太早把页收回去，P 卡在半路的那笔写入会落进别人的页里。</text>
<text x="24.0" y="125.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">Prefill</text>
<line x1="190.0" y1="120.0" x2="936.0" y2="120.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="24.0" y="191.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">Decode</text>
<line x1="190.0" y1="186.0" x2="936.0" y2="186.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="24.0" y="257.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">KV 页 #N</text>
<line x1="190.0" y1="252.0" x2="936.0" y2="252.0" stroke="#e1e0d9" stroke-width="1"/>
<text x="24.0" y="323.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">请求 B</text>
<line x1="190.0" y1="318.0" x2="936.0" y2="318.0" stroke="#e1e0d9" stroke-width="1"/>
<line x1="200.0" y1="92.0" x2="200.0" y2="352.0" stroke="#c3c2b7" stroke-width="1"/>
<text x="200.0" y="370.0" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">t0</text>
<line x1="410.0" y1="92.0" x2="410.0" y2="352.0" stroke="#c3c2b7" stroke-width="1"/>
<text x="410.0" y="370.0" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">t1</text>
<line x1="540.0" y1="92.0" x2="540.0" y2="352.0" stroke="#c3c2b7" stroke-width="1"/>
<text x="540.0" y="370.0" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">t2</text>
<line x1="730.0" y1="92.0" x2="730.0" y2="352.0" stroke="#c3c2b7" stroke-width="1"/>
<text x="730.0" y="370.0" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">t3</text>
<rect x="200.0" y="109.0" width="80.0" height="22.0" rx="3" fill="#2a78d6"/>
<text x="240.0" y="124.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">开始写 A</text>
<rect x="282.0" y="109.0" width="448.0" height="22.0" rx="3" fill="#e1e0d9"/>
<text x="506.0" y="124.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="400">卡住了几秒，写入还在半路</text>
<rect x="730.0" y="109.0" width="26.0" height="22.0" rx="3" fill="#d03b3b"/>
<text x="764.0" y="124.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">这笔写入终于落地</text>
<circle cx="410.0" cy="186.0" r="6" fill="#52514e" stroke="#fcfcfb" stroke-width="2"/>
<text x="422.0" y="178.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="400">等不到结果，判定传输失败</text>
<text x="422.0" y="198.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">释放 A 的页，分给下一个请求</text>
<rect x="200.0" y="241.0" width="208.0" height="22.0" rx="3" fill="#2a78d6"/>
<text x="305.0" y="256.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">属于请求 A</text>
<rect x="410.0" y="241.0" width="128.0" height="22.0" rx="3" fill="#fcfcfb" stroke="#c3c2b7" stroke-width="1"/>
<text x="475.0" y="256.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="400">空闲</text>
<rect x="540.0" y="241.0" width="396.0" height="22.0" rx="3" fill="#1baf7a"/>
<text x="635.0" y="256.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">属于请求 B</text>
<rect x="540.0" y="307.0" width="188.0" height="22.0" rx="3" fill="#1baf7a"/>
<text x="635.0" y="322.0" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">用这些页正常解码</text>
<text x="738.0" y="316.0" font-size="15" fill="#d03b3b" text-anchor="start" font-weight="700">✗</text>
<text x="756.0" y="316.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">B 的 KV 被悄悄改掉</text>
<text x="756.0" y="334.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">没有报错，音频听起来不对</text>
<line x1="730.0" y1="132.0" x2="730.0" y2="240.0" stroke="#d03b3b" stroke-width="2"/>
<polygon points="730.0,241.0 724.6,232.0 735.4,232.0" fill="#d03b3b"/>
</svg>
