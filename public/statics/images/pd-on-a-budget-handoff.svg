<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, &#x27;PingFang SC&#x27;, &#x27;Hiragino Sans GB&#x27;, &#x27;Noto Sans CJK SC&#x27;, &#x27;Microsoft YaHei&#x27;, &#x27;Segoe UI&#x27;, sans-serif">
<title id="t">PD 的一次交接</title>
<desc id="d">请求先到 Prefill（GPU A），它一次算完整个 prompt，产出 KV cache 和第一个 token；KV 和第一个 token 在同一台机器上拷给 Decode（GPU B）；Decode 一步生成一个 token，流式返回给用户。</desc>
<rect width="960" height="330" fill="#fcfcfb"/>
<text x="24.0" y="34.0" font-size="18" fill="#0b0b0b" text-anchor="start" font-weight="600">PD 在干嘛：两张卡，一次交接</text>
<text x="24.0" y="58.0" font-size="13" fill="#52514e" text-anchor="start" font-weight="400">Prefill 一次算完整个 prompt；Decode 拿着它的 KV，一步一个 token 往下生成。</text>
<rect x="24.0" y="106.0" width="110.0" height="64.0" rx="8" fill="#ffffff" stroke="#d6d5ce" stroke-width="1"/>
<text x="36.0" y="128.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">请求</text>
<text x="36.0" y="148.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">文本 + 参考音频</text>
<line x1="134.0" y1="138.0" x2="169.0" y2="138.0" stroke="#52514e" stroke-width="1.5"/><polygon points="176.0,138.0 169.0,133.8 169.0,142.2" fill="#52514e"/>
<rect x="176.0" y="96.0" width="250.0" height="84.0" rx="8" fill="#ffffff" stroke="#52514e" stroke-width="1"/>
<text x="188.0" y="118.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">Prefill（GPU A）</text>
<text x="188.0" y="138.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">一次 forward 算完整个 prompt</text>
<text x="188.0" y="155.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">产出：KV cache + 第一个 token</text>
<line x1="426.0" y1="138.0" x2="548.0" y2="138.0" stroke="#2a78d6" stroke-width="4"/>
<polygon points="560.0,138.0 548.0,130.8 548.0,145.2" fill="#2a78d6"/>
<text x="493.0" y="124.0" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">KV + token0</text>
<text x="493.0" y="162.0" font-size="12" fill="#52514e" text-anchor="middle" font-weight="400">同机拷贝</text>
<rect x="560.0" y="96.0" width="250.0" height="84.0" rx="8" fill="#ffffff" stroke="#52514e" stroke-width="1"/>
<text x="572.0" y="118.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">Decode（GPU B）</text>
<text x="572.0" y="138.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">拿着 KV，一步生成一个 token</text>
<text x="572.0" y="155.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">token1, token2, token3, …</text>
<line x1="810.0" y1="138.0" x2="839.0" y2="138.0" stroke="#52514e" stroke-width="1.5"/><polygon points="846.0,138.0 839.0,133.8 839.0,142.2" fill="#52514e"/>
<rect x="846.0" y="106.0" width="90.0" height="64.0" rx="8" fill="#ffffff" stroke="#d6d5ce" stroke-width="1"/>
<text x="858.0" y="128.0" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">流式返回</text>
<text x="858.0" y="148.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">边生成边播</text>
<rect x="176.0" y="214.0" width="250.0" height="22.0" rx="3" fill="#52514e"/>
<text x="301.0" y="229.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">一大口：上千行一起算</text>
<rect x="560.0" y="214.0" width="30.0" height="22.0" rx="3" fill="#52514e"/>
<text x="575.0" y="229.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">1</text>
<rect x="596.0" y="214.0" width="30.0" height="22.0" rx="3" fill="#52514e"/>
<text x="611.0" y="229.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">2</text>
<rect x="632.0" y="214.0" width="30.0" height="22.0" rx="3" fill="#52514e"/>
<text x="647.0" y="229.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">3</text>
<rect x="668.0" y="214.0" width="30.0" height="22.0" rx="3" fill="#52514e"/>
<text x="683.0" y="229.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">4</text>
<rect x="704.0" y="214.0" width="30.0" height="22.0" rx="3" fill="#52514e"/>
<text x="719.0" y="229.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">5</text>
<rect x="740.0" y="214.0" width="30.0" height="22.0" rx="3" fill="#52514e"/>
<text x="755.0" y="229.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">6</text>
<text x="780.0" y="229.0" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">…</text>
<text x="560.0" y="258.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">很多小步：每步都要把 KV 读一遍</text>
<text x="176.0" y="258.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">算一次就完事</text>
<text x="24.0" y="316.0" font-size="12" fill="#898781" text-anchor="start" font-weight="400">单体部署时，这两件事挤在同一张卡上轮流做：prefill 一来，正在 decode 的流就得停下来等。</text>
</svg>
